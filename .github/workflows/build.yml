name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs when rapid commits arrive; preserve one current run per workflow/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build monorepo
        run: bun turbo build
      - name: Package Linux x64 executable
        run: |
          test -x packages/cyberstrike/dist/cyberstrike-linux-x64/bin/cyberstrike
          test -f packages/cyberstrike/dist/cyberstrike-linux-x64/bin/hackbrowser-worker.js
          tar -czf cyberstrike-linux-x64.tar.gz -C packages/cyberstrike/dist/cyberstrike-linux-x64/bin cyberstrike hackbrowser-worker.js

      - name: Upload runnable Linux x64 build
        uses: actions/upload-artifact@v6
        with:
          name: cyberstrike-linux-x64
          path: cyberstrike-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
