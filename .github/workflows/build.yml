name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs when rapid commits arrive; preserve one current run per workflow/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build monorepo
        run: bun turbo build

      - name: Package Linux x64 executable
        run: |
          BIN_DIR="packages/cyberstrike/dist/cyberstrike-linux-x64/bin"
          test -x "$BIN_DIR/cyberstrike"
          test -f "$BIN_DIR/hackbrowser-worker.js"
          test -f "$BIN_DIR/data/scripts/wayback_endpoints.py"
          tar -czf cyberstrike-linux-x64.tar.gz -C "$BIN_DIR" cyberstrike hackbrowser-worker.js data/scripts

      - name: Verify Linux x64 archive contents
        run: |
          tar -tzf cyberstrike-linux-x64.tar.gz
          tar -tzf cyberstrike-linux-x64.tar.gz | grep -Fx 'data/scripts/wayback_endpoints.py'

      - name: Upload runnable Linux x64 build
        uses: actions/upload-artifact@v6
        with:
          name: cyberstrike-linux-x64
          path: cyberstrike-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
