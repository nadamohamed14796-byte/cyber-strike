name: pr-management

on:
  # Use the unprivileged pull_request event: PR titles/descriptions are untrusted
  # input to an LLM-based duplicate detector.
  pull_request:
    types: [opened]

jobs:
  check-duplicates:
    if: |
      github.event.pull_request.user.login != 'actions-user' &&
      github.event.pull_request.user.login != 'cyberstrike' &&
      github.event.pull_request.user.login != 'rekram1-node' &&
      github.event.pull_request.user.login != 'thdxr' &&
      github.event.pull_request.user.login != 'kommander' &&
      github.event.pull_request.user.login != 'jayair' &&
      github.event.pull_request.user.login != 'fwang' &&
      github.event.pull_request.user.login != 'adamdotdevin' &&
      github.event.pull_request.user.login != 'iamdavidhill' &&
      github.event.pull_request.user.login != 'cyberstrike-agent[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Install local cyberstrike launcher
        run: |
          mkdir -p "$RUNNER_TEMP/cyberstrike-bin"
          cat > "$RUNNER_TEMP/cyberstrike-bin/cyberstrike" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec bun run --cwd "$GITHUB_WORKSPACE/packages/cyberstrike" --conditions=browser src/index.ts "$@"
          EOF
          chmod +x "$RUNNER_TEMP/cyberstrike-bin/cyberstrike"
          echo "$RUNNER_TEMP/cyberstrike-bin" >> "$GITHUB_PATH"

      - name: Build prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "Check for duplicate PRs related to this new PR:"
            echo ""
            echo "CURRENT_PR_NUMBER: $PR_NUMBER"
            echo ""
            echo "Title: $(gh pr view "$PR_NUMBER" --json title --jq .title)"
            echo ""
            echo "Description:"
            gh pr view "$PR_NUMBER" --json body --jq .body
          } > pr_info.txt

      - name: Check for duplicate PRs
        env:
          CYBERSTRIKE_API_KEY: ${{ secrets.CYBERSTRIKE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${CYBERSTRIKE_API_KEY:-}" ]; then
            echo "::notice::Skipping duplicate-PR analysis because CYBERSTRIKE_API_KEY is not configured."
            exit 0
          fi

          # Keep the GitHub write token out of the LLM agent's inherited process environment.
          COMMENT_TOKEN="${GITHUB_TOKEN:-}"
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          COMMENT=$(bun script/duplicate-pr.ts -f pr_info.txt "Check the attached file for PR details and search for duplicates")
          COMMAND_STATUS=$?
          set -e
          export GH_TOKEN="$COMMENT_TOKEN"

          if [ "$COMMAND_STATUS" -ne 0 ]; then
            echo "::warning::Duplicate-PR analysis failed; continuing without an automated comment."
            exit 0
          fi

          if [ "$COMMENT" != "No duplicate PRs found" ]; then
            gh pr comment "$PR_NUMBER" --body "_The following comment was made by an LLM, it may be inaccurate:_

          $COMMENT"
          fi

  add-contributor-label:
    # The pull_request token for fork PRs is read-only; only label same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Add Contributor Label
        uses: actions/github-script@v8
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const issueNumber = isPR ? context.payload.pull_request.number : context.payload.issue.number;
            const authorAssociation = isPR ? context.payload.pull_request.author_association : context.payload.issue.author_association;

            if (authorAssociation === 'CONTRIBUTOR') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['contributor']
              });
            }
