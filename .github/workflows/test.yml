name: test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs when rapid commits arrive; preserve one current run per workflow/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@cyberstrike.io"
          git config --global user.name "cyberstrike"

      - name: Validate skill catalog, cross-skill links, tooling guidance, and publication registry
        run: |
          python3 .cyberstrike/skill/scripts/validate_skill_catalog.py --self-test
          python3 .cyberstrike/skill/scripts/validate_skill_catalog.py --strict-links
          python3 .cyberstrike/skill/scripts/audit_skill_enrichment.py --self-test
          python3 .cyberstrike/skill/scripts/audit_skill_enrichment.py --strict
          bun run packages/cyberstrike/script/generate-registry.ts
          git diff --exit-code -- .cyberstrike/skill/index.json || { git --no-pager diff -- .cyberstrike/skill/index.json; exit 1; }

      - name: Install Chromium for browser integration tests
        run: |
          PLAYWRIGHT_VERSION="$(node -p 'require("./package.json").devDependencies["@playwright/test"]')"
          bunx "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: Run unit tests
        run: bun turbo test

  app-e2e:
    name: app e2e (linux)
    runs-on: ubuntu-24.04
    needs:
      - unit
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install Chromium for Playwright
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Run app browser E2E without external model credentials
        working-directory: packages/app
        run: |
          bun run test:e2e:local -- --grep-invert "(can send a prompt and receive a reply|prompt succeeds when sync message endpoint is unreachable)"

  required:
    name: test (linux)
    runs-on: ubuntu-24.04
    needs:
      - unit
      - app-e2e
    if: always()
    steps:
      - name: Verify upstream test jobs passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "app-e2e=${{ needs.app-e2e.result }}"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.app-e2e.result }}" = "success"
