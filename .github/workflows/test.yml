name: test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs when rapid commits arrive; preserve one current run per workflow/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@cyberstrike.io"
          git config --global user.name "cyberstrike"

      - name: Install Chromium for browser integration tests
        run: bunx playwright install --with-deps chromium

      - name: Run unit tests
        run: bun turbo test

  required:
    name: test (linux)
    runs-on: ubuntu-24.04
    needs:
      - unit
    if: always()
    steps:
      - name: Verify upstream test jobs passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          test "${{ needs.unit.result }}" = "success"
